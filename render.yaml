services:
  - type: web
    name: quorate
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: quorate-db, property: connectionString }
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_VAULT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_BACKEND
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: VENDOR_COACH_EMAIL
        sync: false
      - key: VENDOR_MUSEUM_EMAIL
        sync: false
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: QUORATE_LIVE
        value: "on"
      - key: LIVE_MAX_CLOSES_PER_DAY
        value: "20"
  - type: cron
    name: quorate-tick
    runtime: node
    plan: starter
    schedule: "* * * * *"
    buildCommand: npm ci
    startCommand: npx tsx scripts/tick.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: quorate-db, property: connectionString }
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

databases:
  - name: quorate-db
    plan: basic-256mb
    databaseName: quorate
